# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: nmlstyl
email: joey@joeymariano.com
description: >-
  nmlstyl (say it "animal style") is Joey Mariano's audiovisual project:
  chip/synth/vapor-wave, surf rock, techno, and retro 80s textures, with
  guitar, graffiti, code, and pixel art.
baseurl: ""
url: "https://nmlstyl.art"
github_username: nmlstyl

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap

